# Supabase CLI — links local tooling to hosted project ref
# See https://supabase.com/docs/reference/cli/config
project_id = "jucaqjkgyhyzixzaisjr"

[api]
enabled = true

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://theque.app"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "https://theque.app/**",
  "https://theque.app/auth/callback",
  "https://theque.vercel.app/**",
  "https://theque.vercel.app/auth/callback",
]

# Email HTML for local Supabase; hosted projects copy these files into Dashboard → Authentication → Email Templates.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your thèque sign-in code"
content_path = "./supabase/templates/magic_link.html"
