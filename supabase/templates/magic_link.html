<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Your sign-in code</title>
    <!--
      Supabase Auth → Magic link (Dashboard → Authentication → Email Templates).
      Suggested subject: Your thèque sign-in code
      Code-only: there is no clickable sign-in link — see
      docs/adr/0010-login-code-otp-oauth-open-registration.md.
      Docs: https://supabase.com/docs/guides/auth/auth-email-templates
    -->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #faf8f5;
      -webkit-font-smoothing: antialiased;
    "
  >
    <!-- Wrapper -->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #faf8f5">
      <tr>
        <td align="center" style="padding: 48px 20px">
          <!-- Card: div wrapper clips accent to radius (tables rarely clip children in Gmail, etc.) -->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 440px">
            <tr>
              <td style="padding: 0">
                <div
                  style="
                    border-radius: 18px;
                    overflow: hidden;
                    background-color: #fffefb;
                    border: 1px solid rgba(28, 25, 23, 0.08);
                    box-shadow: 0 8px 32px rgba(28, 25, 23, 0.06);
                  "
                >
                  <!-- Accent stripe (avoid very tall spacer + &nbsp; quirks in Gmail) -->
                  <div
                    style="
                      height: 6px;
                      max-height: 6px;
                      font-size: 1px;
                      line-height: 1px;
                      mso-line-height-rule: exactly;
                      background-color: #b45309;
                    "
                  >
                    &nbsp;
                  </div>
                  <div style="padding: 36px 36px 32px 36px">
                <!-- Brand -->
                <p
                  style="
                    margin: 0 0 28px 0;
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    font-size: 22px;
                    font-weight: 600;
                    letter-spacing: 0.05em;
                    text-transform: lowercase;
                    color: #1c1917;
                    line-height: 1;
                  "
                >
                  thèque
                </p>

                <p
                  style="
                    margin: 0 0 8px 0;
                    font-family:
                      ui-sans-serif,
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    font-size: 13px;
                    font-weight: 600;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    color: #92400e;
                    line-height: 1.4;
                  "
                >
                  Email sign-in
                </p>

                <h1
                  style="
                    margin: 0 0 16px 0;
                    font-family:
                      ui-sans-serif,
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    font-size: 24px;
                    font-weight: 600;
                    color: #1c1917;
                    line-height: 1.25;
                    letter-spacing: -0.02em;
                  "
                >
                  Your sign-in code
                </h1>

                <p
                  style="
                    margin: 0 0 32px 0;
                    font-family:
                      ui-sans-serif,
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #57534e;
                  "
                >
                  Enter this code in the thèque tab you opened. For your security, it expires soon and works only once.
                </p>

                <div
                  style="
                    margin: 0 0 28px 0;
                    padding: 18px 20px;
                    border: 1px dashed #d97706;
                    border-radius: 16px;
                    background-color: #fffbeb;
                    text-align: center;
                  "
                >
                  <p
                    style="
                      margin: 0 0 8px 0;
                      font-family:
                        ui-sans-serif,
                        system-ui,
                        -apple-system,
                        Segoe UI,
                        Roboto,
                        Helvetica,
                        Arial,
                        sans-serif;
                      font-size: 12px;
                      font-weight: 700;
                      letter-spacing: 0.08em;
                      text-transform: uppercase;
                      color: #92400e;
                      line-height: 1.4;
                    "
                  >
                    One-time code
                  </p>
                  <p
                    style="
                      margin: 0;
                      font-family:
                        ui-monospace,
                        SFMono-Regular,
                        Menlo,
                        Monaco,
                        Consolas,
                        Liberation Mono,
                        Courier New,
                        monospace;
                      font-size: 34px;
                      font-weight: 800;
                      letter-spacing: 0.22em;
                      color: #1c1917;
                      line-height: 1.2;
                    "
                  >
                    {{ .Token }}
                  </p>
                </div>

                <p
                  style="
                    margin: 0;
                    font-family:
                      ui-sans-serif,
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    font-size: 13px;
                    line-height: 1.55;
                    color: #78716c;
                  "
                >
                  Didn’t request this? You can ignore this email. Nothing will change on your account.
                </p>
                  </div>
                  <div style="padding: 0 36px 28px 36px">
                <p
                  style="
                    margin: 0;
                    font-family:
                      ui-sans-serif,
                      system-ui,
                      -apple-system,
                      Segoe UI,
                      Roboto,
                      Helvetica,
                      Arial,
                      sans-serif;
                    font-size: 11px;
                    line-height: 1.6;
                    color: #a8a29e;
                  "
                >
                  <span style="color: #78716c">thèque</span>
                  ·
                  <a href="{{ .SiteURL }}" style="color: #92400e; text-decoration: underline">{{ .SiteURL }}</a>
                </p>
                  </div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
