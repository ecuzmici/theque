<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>thèque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ks-popup">
      <header class="ks-header">
        <h1>thèque</h1>
        <p class="ks-tagline">Save this tab</p>
      </header>

      <p id="ks-status" class="ks-status ks-status--muted" role="status"></p>
      <button type="button" id="ks-connect-session" class="ks-btn ks-btn-secondary">
        Connect to thèque
      </button>

      <label class="ks-label" for="ks-note">Note <span class="ks-optional">(optional)</span></label>
      <textarea id="ks-note" class="ks-input ks-textarea" rows="3" maxlength="2000" placeholder="Why are you saving this?"></textarea>

      <button type="button" id="ks-save" class="ks-btn ks-btn-primary">Save current tab</button>

      <details class="ks-settings">
        <summary>Settings</summary>
        <p class="ks-hint">
          This extension connects to https://theque.app. If your connection expires or is revoked,
          reconnect from this popup.
        </p>
      </details>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
