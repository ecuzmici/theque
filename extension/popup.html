<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>thèque</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ks-popup">
      <header class="ks-header">
        <h1>thèque</h1>
        <button type="button" id="ks-open-theque" class="ks-link-btn">Open library</button>
      </header>

      <p id="ks-status" class="ks-status ks-status--muted" role="status"></p>
      <button type="button" id="ks-connect-session" class="ks-btn ks-btn-secondary" hidden>
        Connect your account
      </button>

      <label class="ks-label" for="ks-category">
        Shelf hint <span class="ks-optional">(optional)</span>
      </label>
      <!-- Options are populated at runtime by popup.js from category-hints.ts -->
      <select id="ks-category" class="ks-input ks-select">
        <option value="">Auto detect</option>
      </select>

      <label class="ks-label" for="ks-note">Note <span class="ks-optional">(optional)</span></label>
      <textarea
        id="ks-note"
        class="ks-input ks-textarea"
        rows="3"
        maxlength="2000"
        placeholder="Add a note for future you"
      ></textarea>

      <button type="button" id="ks-save" class="ks-btn ks-btn-primary">Save to thèque</button>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
